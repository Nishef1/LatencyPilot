name: Audit closure collectors

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/audit-closure-tranche1.yml'
      - 'eng/audit-closure-task3-collectors.py'

permissions:
  contents: write

jobs:
  tdd-collectors:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Collector regressions only
        shell: pwsh
        run: python eng/audit-closure-task3-collectors.py tests
      - name: RED collectors
        shell: pwsh
        run: |
          dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
          $red = $LASTEXITCODE
          if ($red -eq 0) { throw 'Collector regressions unexpectedly passed before implementation.' }
          Write-Host "Expected collector RED observed with exit code $red."
          exit 0
      - name: Implement collector semantics
        shell: pwsh
        run: python eng/audit-closure-task3-collectors.py implementation
      - name: GREEN collectors
        shell: pwsh
        run: dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
      - name: Validate and commit collectors
        shell: pwsh
        run: |
          git add tools tests
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: make screening collectors fail soft'
            git push origin HEAD:main
          }
