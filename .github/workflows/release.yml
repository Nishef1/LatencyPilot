name: Release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
      - RELEASE_REVISION
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Three-part version, for example 0.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', 'NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ github.ref }}' -ne 'refs/heads/main') {
              throw 'Manual releases must be dispatched from main.'
            }
            $version = '${{ inputs.version }}'
          }
          else {
            if ('${{ github.ref }}' -ne 'refs/heads/main') {
              throw 'Release requests are accepted only from main.'
            }
            $version = (Get-Content -LiteralPath RELEASE_VERSION -Raw).Trim()
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Version must be exactly three numeric components: MAJOR.MINOR.PATCH.'
          }

          $projectVersion = (& dotnet msbuild src/LatencyPilot.App/LatencyPilot.App.csproj -nologo -getProperty:Version).Trim()
          if ($projectVersion -ne $version) {
            throw "Requested release version '$version' does not match repository Version '$projectVersion'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Remove stale prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale prerelease/tag $tag." }
          }
          else {
            git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              git push origin ":refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale tag $tag." }
            }
          }
          git tag -d $tag 2>$null | Out-Null

      - name: Restore win-x64 graph
        run: dotnet restore LatencyPilot.slnx --runtime win-x64

      - name: Build Release
        run: dotnet build LatencyPilot.slnx --configuration Release --no-restore

      - name: Critical tests
        run: dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release --no-build

      - name: Publish Windows x64 app payload
        run: dotnet publish src/LatencyPilot.App/LatencyPilot.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/payload/App -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=false

      - name: UI window smoke check
        shell: pwsh
        run: |
          $startupLog = Join-Path $env:LOCALAPPDATA 'LatencyPilot\startup-error.log'
          Remove-Item -LiteralPath $startupLog -Force -ErrorAction SilentlyContinue

          $app = (Resolve-Path 'artifacts/payload/App/LatencyPilot.exe').Path
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app -Parent) -PassThru
          $mainWindowFound = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()

              if (Test-Path -LiteralPath $startupLog) {
                $details = Get-Content -LiteralPath $startupLog -Raw -ErrorAction SilentlyContinue
                throw "LatencyPilot reported a startup failure.`n$details"
              }

              if ($process.HasExited) {
                throw "LatencyPilot exited before showing its main window. Exit code: $($process.ExitCode)."
              }

              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'LatencyPilot') {
                $mainWindowFound = $true
                break
              }
            }

            if (-not $mainWindowFound) {
              $process.Refresh()
              throw "LatencyPilot did not expose the expected main window within 15 seconds. Observed title: '$($process.MainWindowTitle)'."
            }

            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) {
              throw "LatencyPilot exited shortly after opening its main window. Exit code: $($process.ExitCode)."
            }
            if ($process.MainWindowTitle -ne 'LatencyPilot') {
              throw "LatencyPilot main window was replaced by an unexpected window: '$($process.MainWindowTitle)'."
            }
            if (Test-Path -LiteralPath $startupLog) {
              $details = Get-Content -LiteralPath $startupLog -Raw -ErrorAction SilentlyContinue
              throw "LatencyPilot wrote a startup failure after opening.`n$details"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish Windows x64 service payload
        run: dotnet publish src/LatencyPilot.Service/LatencyPilot.Service.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/payload/Service -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=false

      - name: Prepare shared payload
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          Copy-Item scripts/Install-Service.ps1 artifacts/payload/Install-Service.ps1
          Copy-Item scripts/Uninstall-Service.ps1 artifacts/payload/Uninstall-Service.ps1
          Copy-Item docs/PHYSICAL_VALIDATION.md artifacts/payload/PHYSICAL_VALIDATION.md
          Copy-Item docs/PORTABLE.md artifacts/payload/PORTABLE.md
          Copy-Item README.md artifacts/payload/README.md
          Copy-Item LICENSE artifacts/payload/LICENSE
          Set-Content -LiteralPath artifacts/payload/VERSION.txt -Value $version -NoNewline
          @(
            "version=$version"
            "commit=$env:GITHUB_SHA"
            "workflow=${{ github.workflow }}"
            "workflow_run=${{ github.run_id }}"
            "ref=${{ github.ref }}"
            "deployment=self-contained-offline"
          ) | Set-Content -LiteralPath artifacts/payload/BUILD_INFO.txt

      - name: Build setup EXE
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $env:LATENCYPILOT_VERSION = $version
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $command) { throw 'Inno Setup compiler was not found on the runner.' }
            $iscc = $command.Source
          }
          & $iscc installer/LatencyPilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $setup = "artifacts/installer/LatencyPilot-$version-win-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$setup.sha256" -Value "$hash  $(Split-Path $setup -Leaf)" -NoNewline
          $sizeMiB = [Math]::Round((Get-Item -LiteralPath $setup).Length / 1MB, 2)
          "### Release offline setup" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $version" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $sizeMiB MiB" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          $portableDir = "artifacts/portable/LatencyPilot-$version-win-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path artifacts/payload/App/* -Destination $portableDir -Recurse -Force
          Copy-Item -Path artifacts/payload/Service -Destination "$portableDir/Service" -Recurse -Force
          Get-ChildItem -LiteralPath artifacts/payload -File | Copy-Item -Destination $portableDir -Force
          $portable = "$portableDir.zip"
          Compress-Archive -Path $portableDir -DestinationPath $portable -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $portable).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$portable.sha256" -Value "$hash  $(Split-Path $portable -Leaf)" -NoNewline
          $sizeMiB = [Math]::Round((Get-Item -LiteralPath $portable).Length / 1MB, 2)
          "### Release portable bundle" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $version" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $sizeMiB MiB" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LatencyPilot-${{ steps.version.outputs.version }}-win-x64-distributions
          path: |
            artifacts/installer/LatencyPilot-${{ steps.version.outputs.version }}-win-x64-setup.exe
            artifacts/installer/LatencyPilot-${{ steps.version.outputs.version }}-win-x64-setup.exe.sha256
            artifacts/portable/LatencyPilot-${{ steps.version.outputs.version }}-win-x64-portable.zip
            artifacts/portable/LatencyPilot-${{ steps.version.outputs.version }}-win-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $setup = "artifacts/installer/LatencyPilot-$version-win-x64-setup.exe"
          $setupChecksum = "$setup.sha256"
          $portable = "artifacts/portable/LatencyPilot-$version-win-x64-portable.zip"
          $portableChecksum = "$portable.sha256"

          git tag $tag $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag $tag." }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag." }

          gh release create $tag $setup $setupChecksum $portable $portableChecksum --title "LatencyPilot $version" --prerelease --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub prerelease $tag." }
