name: Measurement audit cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measurement-audit-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measurement-audit-cleanup
  cancel-in-progress: false

jobs:
  audit-cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Add regressions only
        run: python eng/measurement-audit-cleanup.py tests

      - name: RED - old source must violate the new measurement contracts
        shell: pwsh
        run: |
          dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
          $red = $LASTEXITCODE
          if ($red -eq 0) { throw 'Measurement audit regressions unexpectedly passed before implementation.' }
          Write-Host "Expected RED observed with exit code $red."
          exit 0

      - name: Implement measurement hardening and cleanup
        run: python eng/measurement-audit-cleanup.py implementation

      - name: Keep cancellation last and remove per-frame heap allocation
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          kernel_path = Path('src/LatencyPilot.Platform.Windows/Etw/KernelLatencyCapture.cs')
          kernel = kernel_path.read_text(encoding='utf-8')
          old = (
              "    public static KernelLatencyCaptureResult Capture(\n"
              "        KernelLatencyCaptureOptions options,\n"
              "        CancellationToken cancellationToken = default,\n"
              "        Action? onSessionReady = null)\n"
              "    {\n"
          )
          new = (
              "    public static KernelLatencyCaptureResult Capture(\n"
              "        KernelLatencyCaptureOptions options,\n"
              "        CancellationToken cancellationToken = default) =>\n"
              "        Capture(options, onSessionReady: null, cancellationToken);\n\n"
              "    public static KernelLatencyCaptureResult Capture(\n"
              "        KernelLatencyCaptureOptions options,\n"
              "        Action? onSessionReady,\n"
              "        CancellationToken cancellationToken = default)\n"
              "    {\n"
          )
          kernel_path.write_text(replace_once(kernel, old, new, 'kernel readiness overload'), encoding='utf-8', newline='\n')

          backend_path = Path('tools/LatencyPilot.GateAValidation/GpuAutoAffinityGateABackend.cs')
          backend = backend_path.read_text(encoding='utf-8')
          old_call = (
              "                    new KernelLatencyCaptureOptions(kernelDuration, KernelMaximumEvents),\n"
              "                    deadline.Token,\n"
              "                    () => kernelReady.TrySetResult(true)),\n"
          )
          new_call = (
              "                    new KernelLatencyCaptureOptions(kernelDuration, KernelMaximumEvents),\n"
              "                    () => kernelReady.TrySetResult(true),\n"
              "                    deadline.Token),\n"
          )
          backend_path.write_text(replace_once(backend, old_call, new_call, 'Gate A readiness call'), encoding='utf-8', newline='\n')

          renderer_path = Path('src/LatencyPilot.GpuBenchmark/D3D12BenchmarkRenderer.cs')
          renderer = renderer_path.read_text(encoding='utf-8')
          renderer = replace_once(
              renderer,
              '    private sealed record PendingFrame(\n',
              '    private readonly record struct PendingFrame(\n',
              'PendingFrame allocation')
          old_context = '''        var pending = pendingFrames[contextIndex];
          if (pending is null)
          {
              return null;
          }

          WaitForFence(frameContextFenceValues[contextIndex]);
          var gpuMilliseconds = timestamps[contextIndex].ReadElapsedMilliseconds();
          pendingFrames[contextIndex] = null;
          frameContextFenceValues[contextIndex] = 0;

          return new BenchmarkFrameTelemetry(
              pending.FrameIndex,
              pending.CpuRecordingMilliseconds,
              gpuMilliseconds,
              pending.FramePeriodMilliseconds);
          '''
          new_context = '''        if (pendingFrames[contextIndex] is not { } pending)
          {
              return null;
          }

          WaitForFence(frameContextFenceValues[contextIndex]);
          var gpuMilliseconds = timestamps[contextIndex].ReadElapsedMilliseconds();
          pendingFrames[contextIndex] = null;
          frameContextFenceValues[contextIndex] = 0;

          return new BenchmarkFrameTelemetry(
              pending.FrameIndex,
              pending.CpuRecordingMilliseconds,
              gpuMilliseconds,
              pending.FramePeriodMilliseconds);
          '''
          renderer = replace_once(renderer, old_context, new_context, 'PendingFrame nullable unwrapping')
          renderer_path.write_text(renderer, encoding='utf-8', newline='\n')
          '@ | python -

      - name: GREEN critical contracts
        run: dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release

      - name: Enforce permanent test budget and cleanup state
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/LatencyPilot.CriticalTests -Filter *.cs -File
          $count = ($files | Select-String -Pattern '\[(TestMethod|DataTestMethod)\]').Count
          Write-Host "Permanent MSTest entrypoints: $count"
          if ($count -gt 10) { throw "Permanent test budget exceeded: $count > 10." }
          $stale = Get-ChildItem .github/workflows -Filter 'audit-closure-*.yml' -File
          if ($stale) { $stale | ForEach-Object { Write-Host $_.FullName }; throw 'Stale audit workflows remain.' }
          if (-not (Test-Path .github/workflows/ci.yml)) { throw 'Canonical Tests workflow is missing.' }

      - name: Remove temporary delivery files
        shell: pwsh
        run: git rm -f .github/workflows/measurement-audit-cleanup.yml eng/measurement-audit-cleanup.py

      - name: Commit verified cleanup
        shell: pwsh
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git diff --cached --quiet) { throw 'Measurement audit produced no source changes.' }
          git commit -m 'fix: harden benchmark measurement boundaries'
          git pull --rebase origin main

          dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Post-rebase critical tests failed.' }
          git diff --check
          git push origin HEAD:main
