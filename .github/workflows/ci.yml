name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore LatencyPilot.slnx

      - name: Build Release
        run: dotnet build LatencyPilot.slnx --configuration Release --no-restore

      - name: Critical tests
        run: dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release --no-build

      - name: Publish Windows x64 app
        run: dotnet publish src/LatencyPilot.App/LatencyPilot.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/LatencyPilot-win-x64/App

      - name: Publish Windows x64 service
        run: dotnet publish src/LatencyPilot.Service/LatencyPilot.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/LatencyPilot-win-x64/Service

      - name: Assemble physical-validation bundle
        shell: pwsh
        run: |
          $version = (& dotnet msbuild src/LatencyPilot.App/LatencyPilot.App.csproj -nologo -getProperty:Version).Trim()
          Copy-Item scripts/Install-Service.ps1 artifacts/LatencyPilot-win-x64/Install-Service.ps1
          Copy-Item scripts/Uninstall-Service.ps1 artifacts/LatencyPilot-win-x64/Uninstall-Service.ps1
          Copy-Item docs/PHYSICAL_VALIDATION.md artifacts/LatencyPilot-win-x64/PHYSICAL_VALIDATION.md
          Copy-Item README.md artifacts/LatencyPilot-win-x64/README.md
          Copy-Item LICENSE artifacts/LatencyPilot-win-x64/LICENSE
          Set-Content -LiteralPath artifacts/LatencyPilot-win-x64/VERSION.txt -Value $version -NoNewline

          @(
            "version=$version"
            "commit=$env:GITHUB_SHA"
            "workflow=${{ github.workflow }}"
            "workflow_run=${{ github.run_id }}"
            "ref=${{ github.ref }}"
          ) | Set-Content -LiteralPath artifacts/LatencyPilot-win-x64/BUILD_INFO.txt

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LatencyPilot-win-x64
          path: artifacts/LatencyPilot-win-x64/
          if-no-files-found: error
          retention-days: 7
