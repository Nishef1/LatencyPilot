name: Temporary Evidence Verifier Smoke

on:
  push:
    branches: [main]
    paths:
      - scripts/Verify-Evidence.ps1
      - scripts/Temporary-Verify-Evidence-Smoke.ps1
      - .github/workflows/temp-evidence-verifier-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-evidence-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Parse verifier and temporary fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/Verify-Evidence.ps1', 'scripts/Temporary-Verify-Evidence-Smoke.ps1')) {
            $resolved = (Resolve-Path $path).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              foreach ($parseError in $errors) {
                $line = $parseError.Extent.StartLineNumber
                $column = $parseError.Extent.StartColumnNumber
                $text = $parseError.Extent.Text
                Write-Host "PARSE ERROR $resolved`:$line`:$column :: $($parseError.Message) :: '$text'"
              }
              throw "PowerShell parse failed for $path."
            }
          }

      - name: Evidence verifier smoke
        shell: powershell
        run: .\scripts\Temporary-Verify-Evidence-Smoke.ps1
