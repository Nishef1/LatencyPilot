name: Audit closure USB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/audit-closure-usb.yml'
      - 'eng/audit-closure-task4-usb.py'

permissions:
  contents: write

jobs:
  tdd-usb:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: USB regressions only
        run: python eng/audit-closure-task4-usb.py tests
      - name: RED USB
        shell: pwsh
        run: |
          dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
          $red = $LASTEXITCODE
          if ($red -eq 0) { throw 'USB regressions unexpectedly passed before implementation.' }
          Write-Host "Expected USB RED observed with exit code $red."
          exit 0
      - name: Implement USB evidence closure
        run: python eng/audit-closure-task4-usb.py implementation
      - name: GREEN USB
        run: dotnet test tests/LatencyPilot.CriticalTests/LatencyPilot.CriticalTests.csproj --configuration Release
      - name: Build solution
        run: dotnet build LatencyPilot.slnx --configuration Release --no-restore
      - name: Commit verified USB closure
        shell: pwsh
        run: |
          git add src tests
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: bind USB optimization to primary input evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          }
