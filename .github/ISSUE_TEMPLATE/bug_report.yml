name: Bug report
description: Report a reproducible defect, unsafe behavior, recovery problem, or benchmark anomaly
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LatencyPilot. Do not report security vulnerabilities here; follow SECURITY.md instead.

  - type: input
    id: version
    attributes:
      label: LatencyPilot version / commit
      placeholder: e.g. commit SHA or release tag
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 11 build
      placeholder: e.g. 26100.x
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware and drivers
      description: Include only hardware relevant to the issue. Avoid unnecessary serial numbers or personal data.
      placeholder: CPU, GPU + driver, NIC, USB controller/device, audio device, etc.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it appears incorrect or unsafe.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: state_change
    attributes:
      label: Did LatencyPilot change system state before the problem?
      options:
        - No / read-only analysis
        - Yes, and it reverted successfully
        - Yes, and revert failed or is uncertain
        - I do not know
    validations:
      required: true

  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark / experiment context
      description: If this concerns a result, include workload, run count, primary metrics, guardrails, and any baseline drift/noise information available.

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or diagnostic details
      description: Remove credentials, personal paths, tokens, serial numbers, and unrelated private data before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this is not a security vulnerability requiring private disclosure.
          required: true
        - label: I removed credentials and unnecessary personal/sensitive information.
          required: true
        - label: I am reporting observed behavior, not assuming a benchmark delta is significant without evidence.
          required: true
